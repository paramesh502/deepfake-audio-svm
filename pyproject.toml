[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-audio-svm"
version = "1.0.0"
description = "Deepfake Audio Detection Using Support Vector Machines — 22MAT220 Mathematics for Computing III"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Academic — see LICENSE_NOTES.md" }
authors = [
    { name = "[Author 1]", email = "[email]" },
    { name = "[Author 2]", email = "[email]" },
]

dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "gradio>=4.0.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "ipykernel>=6.0.0"]

[project.scripts]
deepfake-train = "run_local:main"
deepfake-app = "run_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
